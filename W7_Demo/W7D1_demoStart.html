<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W7D2 | Javascript Demo</title>
</head>
<body>

    <h1>W7D2 - Javascript Selector & Event Demo</h1>

    <form>

        <table>

            <tr>
                <!--left side: questions-->
                <td>
                    <label for="first" class="questions">FIRST: </label>
                </td>

                <!--right side: input values-->
                <td>
                    <input type="text" name="first" id="first">

                </td>
            </tr>

            <tr>
                <!--left side: questions-->
                <td>
                    <label for="last" class="questions">LAST: </label>
                </td>

                <!--right side: input values-->
                <td>
                    <input type="text" name="last" id="last">

                </td>
            </tr>

            <tr>
                <!--left side: questions-->
                <td>
                    <label for="age" class="questions">AGE: </label>
                </td>

                <!--right side: input values-->
                <td>
                    <input type="text" name="age" id="age"> 

                </td>
            </tr>

            
            <tr>
                <!--left side: questions-->
                
                <td>
                    <br>
                    <br>
                   <input type="button" id="enter-button" value="ENTER">
                </td>

                <!--right side: input values-->
                <td>
                    

                </td>
            </tr>

        </table>

    </form>

    <br>
    <br>

    <!--a div to hold some info from the form-->

    <h2 id="hello">Hello</h2>

    <div id="info" style="border:1px solid black; width:500px; height:200px;">
    
    </div><!--# info-->

    <br>
    <br>
    <br>

    <!--not just buttons can have click events!-->

    <p id="me">
        Click!
    </p>

    <p id="you">
        Click!
    </p>

    <input type="button" id="submit" value="COOL STUFF!">

    <br><br><br><br><br>
    <p>end</p>
    <!--IN-DOCUMENT JAVASCRIPT BELOW-->
    <script>
        //Write Javascript-->

        //selecting elements from the html document using js --> document is current html file

        //Global var: accessible everywhere after its creation
        var body = document.querySelector(`body`)

        console.log(body)

        //create a new variable to hold a new html element 
        var newP = ``
        newP += `<p>` // newP = newP + <p> ... total =total + 1 ; total += 1
        newP += `Hello World? this content was added to the page using javascript` 
        newP += `</p>`    

        console.log(newP)

        body.innerHTML += newP

        body.id= `main-body`

        console.log(body)

        //set up actionable event
        //adding event listener to the #enter-button at the end of mini form
        document.querySelector(`#enter-button`).addEventListener(`click`, alertInfo)

        function alertInfo(event) {
            //LOCAL vars: these names + vaules are only accessible within this function's code block
            var fname = document.querySelector(`#first`).value 

            console.log(fname)

            var lname = document.querySelector(`#last`).value
            var age = document.querySelector(`age`).value

            console.log(`the user's name is ${fname}${lname} and they are ${age}y.o`)

            //if(age >= 18){
                //alert(`you are old enough to vote!`)

            //}
            //else {
                //alert(`You are too young to vote!`)
            //}

            //select the #hello element and add the users name to it directily in the page 
            var hello = document.querySelector(`#hello`)

            hello.innerHTML += ` ${fname} ${lname}!`

            //store the #info element into a var to use /edit later
            var info = document.querySelector(`#info`)

            var dog_age = (age * 7).toFixed(1) //fixes 1 decimal place to number 

            info.innerHTML += `<p><br>Here is some info on the age you entered
                <br><br>Your Age : ${age} <br><br> Age in dog years : ${dog_age}</p>`
        }//end of alertInfo()

    </script>
	
</body>
</html>
