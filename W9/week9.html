<script type="text/javascript">
	//Use this Array of objects to complete the assignment.
	var people =[
		{first:"Ian", last:"Somerhalder", credit:"Damon Salvatore in The Vampire Diaries" },
		{first:"Nina", last:"Dobrev", credit:"Elena Gilbert in The Vampire Diaries" },
		{first:"Paul", last:"Wesley", credit:"Stefan Salvatore in The Vampire Diaries" },
		{first:"Candice", last:"King", credit:"Caroline Forbes in The Vampire Diaries" },
		{first:"Kat", last:"Graham", credit:"Bonnie Bennett in The Vampire Diaries" },
		{first:"Michael", last:"Trevino", credit:"Tyler Lockwood in The Vampire Diaries" },
		{first:"Matthew", last:"Davis", credit:"Alaric Saltzman in The Vampire Diaries" }
	]
	
	console.log(people[0])
	console.log(people[0].first)

	var body = document.querySelector(`body`)
	console.log(body)
	console.dir(body)

	for(let i=0; i < people.length; i++)
	{
		var tempDiv = document.createElement(`div`)
		tempDiv.setAttribute(`class`, `border`)
		tempDiv.setAttribute(`id`, i)
		
		for(let key in people[i])
		{
			var p = document.createElement(`p`)
			var text = document.createTextNode(people[i][key])
			
			p.appendChild(text)
			tempDiv.appendChild(p)
		}
		body.appendChild(tempDiv)
	}
</script>
